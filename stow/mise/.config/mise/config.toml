node = "24"
pnpm = "11"
python = "3.14"
java = "26"

"npm:defuddle" = "latest"
"npm:eas-cli" = "latest"
"npm:@posthog/cli" = "latest"
"npm:@slidev/cli" = "latest"
"npm:@mermaid-js/mermaid-cli" = "11.17.0"
# uncomment (goldziher/uncomment): AST/tree-sitter comment stripper. The
# deterministic half of the agent comment-noise stack — invoked by the opt-in
# Stop/agentStop hooks and per-repo commit gates. Installed from GitHub releases
# because the npm package (uncomment-cli) ships a stale committed 2.0.0 binary
# on every version — its publish workflow never builds, so an npm pin can't
# deliver the pinned version's behavior.
"github:Goldziher/uncomment" = "3.5.1"
