source-file "$HOME/.config/tmux/tmux.conf"
set -g default-shell /bin/sh
set -g default-command 'exec "$HOME/.local/bin/pi-mobile" _run'
set -g update-environment "SSH_CONNECTION SSH_CLIENT SSH_TTY"
set -g detach-on-destroy on
set -g destroy-unattached off
set -g remain-on-exit off
set -g allow-rename off
set -g automatic-rename off
set -g window-size latest
set -g status-left " mobile "
set -g status-right "C-b w/r/d"
bind-key r new-window -n resume -c "$HOME"
