<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>Entities</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
:root {
  --bg: #f4f4f6; --card: #ffffff; --ink: #1c1c1f; --muted: #6e6e76;
  --line: #e3e3e8; --accent: #2f6fed; --accent-ink: #ffffff;
  --create: #237950; --create-ink: #ffffff;
  --warn: #b45309; --warn-bg: #fef3e2;
  --danger: #b3372f; --chip: #f0f0f3; --shadow: 0 1px 3px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101014; --card: #1b1b21; --ink: #ececf1; --muted: #9a9aa5;
    --line: #2c2c34; --accent: #5b8ff5; --accent-ink: #0e1420;
    --create: #55b285; --create-ink: #0b1811;
    --warn: #e8a24c; --warn-bg: #33270f;
    --danger: #e07a70; --chip: #26262e; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
main { max-width: 640px; margin: 0 auto; padding: 0 14px 96px; }
header.app {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 14px 2px 10px; display: flex; align-items: baseline; gap: 10px;
}
header.app h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
header.app .sub { color: var(--muted); font-size: 14px; flex: 1; }
button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; color: inherit; padding: 0; }
.iconbtn { color: var(--muted); font-size: 14px; padding: 6px 8px; border-radius: 8px; }
.iconbtn:active { background: var(--chip); }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 12px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { outline: 2px solid var(--accent); outline-offset: 2px; }
  100% { outline: 2px solid transparent; outline-offset: 2px; } }
.card.leaving { opacity: 0; transform: translateX(24px); transition: all .18s ease-in; }
.cardtop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cardtop .who { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.cardtop .meta { color: var(--muted); font-size: 13px; }
.badge {
  font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px;
  background: var(--warn-bg); color: var(--warn); white-space: nowrap;
}
.notice {
  margin: 8px 0 2px; padding: 8px 10px; border-radius: 9px;
  background: var(--warn-bg); color: var(--warn); font-size: 13.5px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font-size: 12.5px; background: var(--chip); color: var(--muted);
  padding: 3px 9px; border-radius: 99px; text-decoration: none; border: 0;
}
a.chip:active, button.chip:active { opacity: .7; }
.evidence { margin: 10px 0 4px; padding: 0; list-style: none; }
.evidence li { padding: 5px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.evidence li:first-child { border-top: 0; }
.evidence .d { color: var(--muted); font-size: 12.5px; margin-right: 7px; font-variant-numeric: tabular-nums; }
.evidence .src { color: var(--muted); font-size: 12.5px; }
.evidence .src a { color: inherit; }
.evidence .fact { display: block; margin-top: 1px; }
.evidence .upd { display: block; color: var(--muted); font-size: 13.5px; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600;
  background: var(--chip); color: var(--ink); flex: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.into { background: var(--accent); color: var(--accent-ink); }
.btn.create { background: var(--create); color: var(--create-ink); }
.btn.quiet { background: none; color: var(--muted); font-weight: 500; }
.btn.danger { background: none; color: var(--danger); font-weight: 500; }
.btn:active { filter: brightness(.92); }
.btn:disabled { opacity: .5; }
.plan { margin-top: 8px; }
.planhead { font-weight: 650; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.plan .rows { margin: 2px 0 0 0; padding: 0; list-style: none; }
.plan .rows li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 14.5px; }
.plan input[type=checkbox] {
  width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none;
}
.plan .rows .rowtext { flex: 1; }
.plan .rows input[type=text] {
  width: 100%; font: inherit; color: inherit; background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px;
}
li.off .rowtext { opacity: .4; text-decoration: line-through; }
.fieldkey { color: var(--muted); }
.pencil { opacity: .35; font-size: 12px; }
.editing .pencil { display: none; }
.who input[type=text], .planhead input[type=text] {
  font: inherit; color: inherit; background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px;
  max-width: 14em;
}
.captured { background: var(--chip); border-radius: 9px; padding: 10px 12px;
  font-size: 14px; white-space: pre-wrap; margin-top: 8px; max-height: 180px; overflow-y: auto; }
.capture label { display: block; margin-top: 12px; font-size: 14.5px; }
.capture input, .capture select, .capture textarea {
  display: block; width: 100%; min-height: 44px; margin-top: 6px;
  font: inherit; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
.capture textarea { min-height: 80px; resize: vertical; }
.state { text-align: center; color: var(--muted); padding: 48px 20px; }
.state .big { font-size: 40px; margin-bottom: 10px; }
.state .btn { margin-top: 14px; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20;
  background: var(--ink); color: var(--bg); border-radius: 12px;
  padding: 11px 16px; font-size: 14.5px; display: flex; gap: 14px; align-items: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: min(92vw, 480px);
}
#toast button { color: var(--accent); font-weight: 700; font-size: 14.5px; }
#toast.hidden, .hidden { display: none !important; }
#banner {
  position: sticky; top: 52px; z-index: 4; margin: 0 0 10px;
  background: var(--warn-bg); color: var(--warn); border-radius: 10px;
  padding: 9px 12px; font-size: 14px;
}
#picker {
  position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 600px) { #picker { align-items: center; } }
#picker .sheet {
  background: var(--card); width: 100%; max-width: 480px;
  border-radius: 16px 16px 0 0; max-height: 78vh; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
@media (min-width: 600px) { #picker .sheet { border-radius: 16px; } }
#picker header { padding: 14px 16px 8px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
#picker input[type=search] {
  margin: 0 16px 10px; padding: 10px 12px; font: inherit; color: inherit;
  background: var(--chip); border: 1px solid var(--line); border-radius: 10px;
}
#picker ul { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; }
#picker li button {
  width: 100%; text-align: left; color: var(--ink);
  padding: 11px 10px; border-radius: 10px; font-size: 15.5px;
  display: flex; align-items: baseline; gap: 8px;
}
#picker li button:active { background: var(--chip); }
#picker .alias { color: var(--muted); font-size: 13px; }
#picker .tag { margin-left: auto; font-size: 11.5px; color: var(--accent); font-weight: 600; }
.applying { color: var(--muted); font-size: 13px; }
.applying .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px;
  background: var(--accent); margin-right: 5px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<main>
  <header class="app">
    <h1>Entities</h1>
    <span class="sub" id="counts"></span>
    <button class="iconbtn" id="applyBtn" data-act="apply"></button>
    <button class="iconbtn" data-act="refresh" aria-label="Refresh">↻</button>
  </header>
  <div id="banner" class="hidden"></div>
  <div id="content"><div class="state">Loading…</div></div>
</main>
<div id="toast" class="hidden"></div>
<div id="picker" class="hidden"></div>

<script>
"use strict";
let queue = null;
let toastTimer = null;
let pollTimer = null;
let local = {};
let staleEdit = false;

const $ = (sel, el) => (el || document).querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), {data});
  return data;
}

function banner(msg) {
  const el = $("#banner");
  el.textContent = msg || "";
  el.classList.toggle("hidden", !msg);
}

/* ---------- pure core ----------
   Everything between the markers is DOM-free and state-free so
   devonthink/tests/test_entity_review_ui.py can drive it directly.
   BEGIN PURE CORE */

function fpOf(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(36);
}

function emptyOverlay() { return {edits: {}, off: {}}; }

function overlayOf(store, key) { return store[key] || emptyOverlay(); }

function editedValue(ov, slot, fallback) {
  const v = ov.edits[slot];
  return v === undefined ? fallback : v;
}

function isOff(ov, slot) { return !!ov.off[slot]; }

function pruneOverlay(store, liveKeys, pinned) {
  const live = {};
  for (const k of liveKeys) live[k] = true;
  const out = {};
  for (const k of Object.keys(store)) {
    if (live[k] || k === pinned) out[k] = store[k];
  }
  return out;
}

/* Unchanged markup means the node is reused, so a background refresh never
   rebuilds a card the user is typing into; the pinned card is deferred, not
   replaced, when its data did change. */
function planRender(current, desired, pinned) {
  const cur = {};
  current.forEach(it => { cur[it.key] = it.fp; });
  const want = {};
  desired.forEach(it => { want[it.key] = it.fp; });
  const remove = [], replace = [], insert = [], defer = [];
  for (const it of current) {
    if (!(it.key in want) && it.key !== pinned) remove.push(it.key);
  }
  for (const it of desired) {
    if (!(it.key in cur)) insert.push(it.key);
    else if (cur[it.key] === it.fp) continue;
    else if (it.key === pinned) defer.push(it.key);
    else replace.push(it.key);
  }
  const order = desired.map(it => it.key);
  let stale = false;
  if (pinned && pinned in cur && !(pinned in want)) {
    stale = true;
    let at = 0;
    for (let i = 0; i < current.length && current[i].key !== pinned; i++) {
      if (current[i].key in want) at++;
    }
    order.splice(at, 0, pinned);
  }
  return {remove, replace, insert, defer, order, stale};
}

function buildSpec(pv, ov) {
  const people = [], events = [];
  let changed = false;
  pv.plans.forEach((plan, pi) => {
    if (isOff(ov, "plan:" + pi)) { changed = true; return; }
    if (plan.kind === "event") {
      events.push({name: plan.name, date: plan.date, location: plan.location,
                   attendees: plan.attendees, summary: plan.summary});
      return;
    }
    const name = editedValue(ov, "pname:" + pi, plan.name);
    if (name !== plan.name) changed = true;
    const facts = [];
    plan.facts.forEach((f, fi) => {
      const slot = "fact:" + pi + ":" + fi;
      if (isOff(ov, slot)) { changed = true; return; }
      const text = editedValue(ov, slot, f[1]);
      if (text !== f[1]) changed = true;
      if (text) facts.push({date: f[0], fact: text});
    });
    const updates = {};
    for (const [k, v] of Object.entries(plan.updates)) {
      const slot = "field:" + pi + ":" + k;
      if (isOff(ov, slot)) { changed = true; continue; }
      const value = editedValue(ov, slot, v);
      if (value !== v) changed = true;
      if (value) updates[k] = value;
    }
    if (!facts.length && !Object.keys(updates).length) return;
    people.push({name, interacted: !!plan.interacted, facts, updates});
  });
  return {people, events, changed};
}

/* END PURE CORE */

function ov(key) {
  if (!local[key]) local[key] = emptyOverlay();
  return local[key];
}

function setEdit(key, slot, value) { ov(key).edits[slot] = value; }

function setOff(key, slot, off) {
  const o = ov(key);
  if (off) o.off[slot] = true;
  else delete o.off[slot];
}

function cardKeyOf(el) {
  const card = el.closest("[data-key]");
  return card ? card.dataset.key : null;
}

function pinnedKey() {
  const el = document.activeElement;
  if (!el || !el.matches || !el.matches("input, textarea, select")) return null;
  if (!el.closest("#content")) return null;
  return cardKeyOf(el);
}

async function refresh(manual) {
  try {
    queue = await api("api/queue");
    banner("");
    const requested = location.hash.slice(1);
    if (/^[A-Za-z0-9-]{8,}$/.test(requested) && queue.dt === "ok" &&
        ![...(queue.captures || []),...(queue.candidates || []),...(queue.proposals || [])].some(c => c.uuid === requested)) {
      try { (queue.captures || (queue.captures = [])).push(await api("api/capture/" + requested)); }
      catch(e) { banner(e.message); }
    }
    render();
  } catch (e) {
    if (manual || !queue) {
      queue = null;
      showState("offline",
        '<div class="state"><div class="big">⚠️</div>Can’t reach the review server.' +
        '<div><button class="btn" data-act="refresh">Try again</button></div></div>');
    } else {
      banner("Couldn’t refresh — " + e.message);
    }
  }
}

function item(key, html) { return {key, fp: fpOf(html), html}; }

function showState(key, html) {
  applyItems($("#content"), [item("state:" + key, html)], pinnedKey());
}

function viewItems() {
  if (queue.dt === "closed") {
    return [item("state:dt-closed",
      '<div class="state"><div class="big">💤</div>DEVONthink isn’t open on the Mac.' +
      '<div><button class="btn primary" data-act="open-dt">Open it</button></div></div>')];
  }
  if (queue.dt === "error") {
    return [item("state:dt-error",
      '<div class="state"><div class="big">⚠️</div>Something went wrong reading the queue.' +
      '<div><button class="btn" data-act="refresh">Try again</button></div></div>')];
  }
  const cands = queue.candidates || [];
  const props = queue.proposals || [];
  const items = [];
  const captures = queue.captures || [];
  for (const plan of queue.migration_plans || []) {
    if (plan.status === "pending") continue;
    items.push(item("m:" + plan.id, '<div class="notice">Migration plan ' + esc(plan.status) +
      '. Registered plan ID: <code style="overflow-wrap:anywhere">' + esc(plan.id) + '</code>' +
      (plan.status === "reviewed" ? '<p>Apply this exact registered artifact separately. Review has not migrated any records.</p>' : '') + '</div>'));
  }
  if (captures.length) {
    items.push(item("h:captures", '<h2 class="sec">Saved notes and questions</h2>'));
    for (const cv of captures) {
      const key = "c-" + cv.uuid;
      items.push(item(key, captureCard(cv, overlayOf(local, key))));
    }
  }
  if (cands.length) {
    items.push(item("h:cands", '<h2 class="sec">People to review</h2>'));
    for (const cv of cands) {
      const key = "c-" + cv.uuid;
      items.push(item(key, candidateCard(cv, overlayOf(local, key))));
    }
  }
  if (props.length) {
    items.push(item("h:props", '<h2 class="sec">Filings to approve</h2>'));
    for (const pv of props) {
      const key = "c-" + pv.uuid;
      items.push(item(key, proposalCard(pv, overlayOf(local, key))));
    }
  }
  if (!items.length) {
    const queued = (queue.queued.candidates || 0) + (queue.queued.proposals || 0);
    items.push(item("state:clear",
      '<div class="state"><div class="big">✅</div>All clear.' +
      (queued ? "<div>" + queued + " decision" + (queued > 1 ? "s" : "") +
        " finishing up.</div>" : "") + "</div>"));
  }
  return items;
}

function childByKey(c, key) {
  for (const el of c.children) if ((el.dataset.key || "") === key) return el;
  return null;
}

function buildNode(it) {
  const t = document.createElement("template");
  t.innerHTML = it.html.trim();
  const el = t.content.firstElementChild;
  el.dataset.key = it.key;
  el.dataset.fp = it.fp;
  return el;
}

function applyItems(c, items, pinned) {
  const current = [];
  for (const el of c.children) {
    current.push({key: el.dataset.key || "", fp: el.dataset.fp || ""});
  }
  const byKey = {};
  for (const it of items) byKey[it.key] = it;
  const plan = planRender(current, items, pinned);
  for (const key of plan.remove) {
    const el = childByKey(c, key);
    if (el) el.remove();
  }
  for (const key of plan.replace) {
    const el = childByKey(c, key);
    if (el) el.replaceWith(buildNode(byKey[key]));
  }
  for (const key of plan.insert) c.appendChild(buildNode(byKey[key]));
  let prev = null;
  for (const key of plan.order) {
    const el = childByKey(c, key);
    if (!el) continue;
    const want = prev ? prev.nextSibling : c.firstChild;
    // Reparenting a focused node blurs it, and iOS won't reopen the
    // keyboard outside a gesture — so the pinned card never moves.
    if (el !== want && key !== pinned) c.insertBefore(el, want);
    prev = el;
  }
  return plan;
}

function render() {
  clearTimeout(pollTimer);
  if (!queue) return;
  const pinned = pinnedKey();
  const items = viewItems();
  // A closed/errored queue renders no cards; pruning against it would throw
  // away edits that are still pending once DEVONthink answers again.
  if (queue.dt === "ok") {
    local = pruneOverlay(local, items.map(it => it.key), pinned);
  }
  const plan = applyItems($("#content"), items, pinned);
  if (plan.stale) staleEdit = true;
  if (staleEdit && !pinned) {
    staleEdit = false;
    banner("That card was handled on the Mac — your edit wasn’t applied.");
  }
  updateHeader();
  if (!pinned) jumpToHash();
}

function updateHeader() {
  const n = queue ? (queue.candidates || []).length + (queue.proposals || []).length : 0;
  $("#counts").textContent = n ? n + " to review" : "";
  const a = (queue && queue.apply) || {};
  const queued = queue ? (queue.queued.candidates || 0) + (queue.queued.proposals || 0) : 0;
  const btn = $("#applyBtn");
  if (a.state === "running") {
    btn.innerHTML = '<span class="applying"><span class="dot"></span>applying…</span>';
    btn.disabled = true;
    schedulePoll(4000);
  } else if (a.state === "scheduled") {
    btn.innerHTML = '<span class="applying"><span class="dot"></span>queued</span>';
    btn.disabled = true;
    schedulePoll(8000);
  } else if (queued) {
    btn.textContent = "Finish " + queued + " now";
    btn.disabled = false;
  } else {
    btn.textContent = "";
    btn.disabled = true;
  }
}

function schedulePoll(ms) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(() => refresh(false), ms);
}

function dtLink(uuid, label) {
  return '<a class="chip" href="x-devonthink-item://' + esc(uuid) + '">' +
    esc(label) + "</a>";
}

function captureCard(cv, o) {
  const u = esc(cv.uuid);
  const migration = !!cv.migration_plan;
  if (migration) o = captureOverlay(cv.uuid);
  const finished = ["filed", "undone", "retained"].includes(cv.status);
  const editing = !migration && (!!o.captureEdit || !finished) && cv.status !== "correcting";
  const technical = ["waiting", "deferred", "broken", "correcting"].includes(cv.status);
  let html = '<div class="card capture" id="c-' + u + '"><div class="cardtop"><span class="who">' +
    esc(migration ? "Migration review" : cv.status === "filed" ? "Saved" : cv.status === "undone" ? "Filing undone" : cv.status === "retained" ? "Existing filings kept" : technical ? "Waiting for processing" : "A question about your note") +
    '</span><span class="meta">' + esc(cv.date || "") + '</span></div>';
  html += '<div class="chips">' + dtLink(cv.source_uuid || cv.uuid, "Original note") + '</div>';
  if (!finished) html += '<div class="notice">' + esc(cv.question) + '</div>';
  if (!editing) html += '<div class="captured">' + esc(cv.text) + '</div>';
  if (cv.status === "correcting" && cv.current_text !== undefined && cv.current_text !== cv.text) html += '<label>Current source<div class="captured">' + esc(cv.current_text) + '</div></label>';
  if (editing && !["waiting", "broken"].includes(cv.status)) {
    o = captureOverlay(cv.uuid);
    if (o.captureRevision !== cv.revision) html += '<div class="notice">The source changed while you were editing. Your draft is retained.<button class="btn" data-act="capture-reload" data-uuid="' + u + '">Reload the changed note and discard these edits</button></div>';
    const text = o.captureText;
    html += '<label>Captured note<textarea class="captured" style="width:100%;max-height:none" data-capture-text="1">' + esc(text) + '</textarea></label>';
    const rows = o.captureRows || (cv.subjects.length ? cv.subjects.map(s => ({mention:s.mention, passage:s.passage, target:s.uuid, email:s.email || ""})) :
      [{mention:"", passage:cv.text, target:"", email:""}]);
    rows.forEach((row, i) => {
      html += '<div class="plan"><label>Name as written (optional when choosing an existing person)<input type="text" data-capture-row="' + i + '" data-field="mention" value="' + esc(row.mention) + '"></label>' +
        '<label>Person<select data-capture-row="' + i + '" data-field="target"><option value="">Resolve from this name</option><option value="new"' + (row.target === "new" ? " selected" : "") + '>Someone new</option>';
      for (const p of queue.roster || []) html += '<option value="' + esc(p.uuid) + '"' + (row.target === p.uuid ? " selected" : "") + '>' + esc([p.name,p.city,p.employer].filter(Boolean).join(" · ")) + '</option>';
      html += '</select></label><label>Email from this passage (optional)<input type="text" data-capture-row="' + i + '" data-field="email" value="' + esc(row.email || "") + '"></label><label>Exact passage<textarea class="captured" style="width:100%;max-height:none" data-capture-row="' + i + '" data-field="passage">' + esc(row.passage) + '</textarea></label><button class="btn quiet" data-act="capture-remove" data-uuid="' + u + '" data-row="' + i + '"' + (rows.length === 1 ? ' disabled' : '') + '>Remove subject</button></div>';
    });
    html += '<button class="btn quiet" data-act="capture-add" data-uuid="' + u + '">Add another subject and passage</button>';
    if (cv.choices.length) html += '<div class="notice">Possible people: ' + esc(cv.choices.map(p => [p.name,p.city,p.employer].filter(Boolean).join(", ")).join("; ")) + '</div>';
  }
  for (const q of cv.semantic_questions || []) {
    const answer = (o.captureAnswers || {})[q.key] || "";
    html += '<div class="plan"><label>Complete source evidence<div class="captured">' + esc(q.evidence) +
      '</div></label><p>Proposed assertion: ' + esc(q.assertion) + '</p><p>Observed on ' + esc(q.observed_date) +
      '. Confirm only when the full assertion, qualifiers, and time are the same.</p><label>Disposition<select data-semantic-key="' + esc(q.key) +
      '"><option value="">Choose a disposition</option>';
    const options = [{id:"separate", text:"Keep separate"}, {id:"source", text:"Keep source wording"}].concat(
      q.candidates.map(c => ({id:c.id, text:"Same complete assertion: " + c.text + " [" + c.temporal_context + "]"})));
    for (const choice of options) html += '<option value="' + esc(choice.id) + '"' + (answer === choice.id ? ' selected' : '') + '>' + esc(choice.text) + '</option>';
    html += '</select></label></div>';
  }
  html += '<div class="actions">';
  if (migration) html += '<button class="btn primary" data-act="migration-answer" data-uuid="' + u + '">Record these migration choices</button>';
  if (editing && !["waiting", "broken"].includes(cv.status)) html += '<button class="btn primary" data-act="capture-save" data-uuid="' + u + '">Save to the selected people</button>';
  if (cv.status === "filed") html += '<button class="btn" data-act="capture-edit" data-uuid="' + u + '">Wrong person</button><button class="btn danger" data-act="capture-undo" data-uuid="' + u + '">Undo this capture\'s filing</button>';
  if (cv.can_retain_legacy) html += '<button class="btn" data-act="capture-retain" data-uuid="' + u + '">Keep existing filings</button>';
  if (cv.conflict) html += '<button class="btn" data-act="capture-keep" data-uuid="' + u + '">Keep the edited text and finish</button>';
  if (cv.status === "correcting") html += '<button class="btn" data-act="capture-retry" data-uuid="' + u + '">Resume correction</button>';
  if (!migration && !finished && !["waiting", "broken", "correcting"].includes(cv.status)) html += '<button class="btn quiet" data-act="capture-defer" data-uuid="' + u + '">Decide later</button><button class="btn" data-act="capture-retry" data-uuid="' + u + '">Retry processing</button>';
  return html + '</div></div>';
}

function captureOverlay(uuid) {
  const key = "c-" + uuid;
  const cv = (queue.captures || []).find(c => c.uuid === uuid);
  const o = local[key] || (local[key] = emptyOverlay());
  if (o.captureRevision === undefined) {
    o.captureRevision = cv.revision;
    o.captureText = cv.text;
  }
  if (!o.captureRows) o.captureRows = cv.subjects.length ? cv.subjects.map(s => ({mention:s.mention, passage:s.passage, target:s.uuid, email:s.email || ""})) :
    [{mention:"", passage:cv.text, target:"", email:""}];
  return o;
}

async function decideCapture(uuid, action) {
  const cv = queue.captures.find(c => c.uuid === uuid);
  if (cv.migration_plan) {
    try {
      const result = await api("api/biographical-plan/" + cv.migration_plan,
        {source_uuid:cv.source_uuid, answers:captureOverlay(uuid).captureAnswers || {}});
      toast(result.status === "migration_reviewed" ? "Migration plan reviewed. Apply it separately." : "Choices recorded. More migration questions remain.");
      delete local["c-" + uuid];
      await refresh(false);
    } catch(e) { banner(e.message); }
    return;
  }
  const body = {action, revision:cv.revision};
  if (action === "save") {
    const o = captureOverlay(uuid);
    body.revision = o.captureRevision;
    body.text = o.captureText;
    body.semantic_answers = o.captureAnswers || {};
    body.subjects = o.captureRows.map(r => ({mention:r.mention, passage:r.passage,
      target:r.target === "new" ? "" : r.target, new:r.target === "new", email:r.email || ""}));
  }
  try {
    const result = await api("api/capture/" + uuid, body);
    toast(result.status === "filed" ? "Saved" : result.status === "undone" ? "Filing undone" : result.status === "retained" ? "Existing filings kept" : action === "defer" ? "Kept for later" : "Waiting for processing");
    delete local["c-" + uuid];
    await refresh(false);
  } catch(e) { banner(e.message); }
}

/* ---------- candidates ---------- */

function candidateCard(cv, o) {
  if (cv.broken) {
    return '<div class="card" id="c-' + esc(cv.uuid) + '"><div class="cardtop">' +
      '<span class="who">' + esc(cv.name) + '</span>' +
      '<span class="badge">unreadable</span></div>' +
      '<div class="notice">This record can’t be read here — it needs a look in DEVONthink.</div>' +
      '<div class="chips">' + dtLink(cv.uuid, "Open in DEVONthink") + "</div></div>";
  }
  const name = editedValue(o, "cname", cv.name);
  const seen = cv.seen.count + (cv.seen.count === 1 ? " sighting" : " sightings") +
    (cv.seen.last ? " · last " + cv.seen.last : "");
  let html = '<div class="card" id="c-' + esc(cv.uuid) + '"><div class="cardtop">' +
    '<span class="who" data-role="cname" data-slot="cname" data-max="120">' +
    '<span class="txt">' + esc(name) + '</span> <span class="pencil">✎</span></span>' +
    '<span class="meta">' + esc(seen) + "</span>" +
    (cv.urgent ? '<span class="badge">has a saved fact</span>' : "") +
    (cv.detached ? '<span class="badge">decide promptly</span>' : "") +
    "</div>";
  if (cv.notice) html += '<div class="notice">' + esc(cv.notice) + "</div>";
  const chips = [];
  for (const e of cv.emails) chips.push('<span class="chip">' + esc(e) + "</span>");
  for (const v of cv.variants) chips.push('<span class="chip">also “' + esc(v) + "”</span>");
  for (const p of cv.peers) chips.push(dtLink(p.uuid, "same name: " + p.name));
  if (chips.length) html += '<div class="chips">' + chips.join("") + "</div>";
  html += evidenceList(cv.sightings);
  html += candidateActions(cv, name !== cv.name);
  return html + "</div>";
}

function evidenceList(sightings) {
  if (!sightings.length) return "";
  let html = '<ul class="evidence">';
  for (const s of sightings) {
    html += '<li><span class="d">' + esc(s.date || "") + "</span>";
    const where = s.title || (s.kind === "fact" ? "saved fact" : "note");
    html += '<span class="src">' +
      (s.source_uuid
        ? '<a href="x-devonthink-item://' + esc(s.source_uuid) + '">' + esc(where) + "</a>"
        : esc(where)) + "</span>";
    for (const f of s.facts || []) html += '<span class="fact">' + esc(f[1]) + "</span>";
    for (const [k, v] of Object.entries(s.updates || {}))
      html += '<span class="upd">' + esc(k) + " → " + esc(v) + "</span>";
    html += "</li>";
  }
  return html + "</ul>";
}

function candBtn(cls, cv, action, label, opts) {
  opts = opts || {};
  return '<button class="btn ' + cls + '" data-act="cand" data-uuid="' + esc(cv.uuid) +
    '" data-action="' + action + '"' +
    (opts.target ? ' data-target="' + esc(opts.target) + '"' : "") +
    (opts.distinct ? ' data-distinct="1"' : "") +
    (opts.noundo ? ' data-noundo="1"' : "") +
    (opts.tip ? ' title="' + esc(opts.tip) + '"' : "") +
    (opts.disabled ? " disabled" : "") +
    ' data-msg="' + esc(opts.msg || label) + '">' + esc(label) + "</button>";
}

function candidateActions(cv, edited) {
  const d = cv.disposition || {};
  const pickerBtn = label => '<button class="btn" data-act="picker" data-uuid="' +
    esc(cv.uuid) + '"' + (edited ? " disabled" : "") + ">" + label + "</button>";
  let html = '<div class="actions">';
  if (d.kind === "file_into") {
    html += candBtn("into", cv, "track", "File into " + d.target.name,
      {target: d.target.uuid, msg: "Filed into " + d.target.name,
       disabled: edited});
  } else if (d.kind === "new_ok") {
    html += candBtn("create", cv, "track", "Add as new person", {msg: "Added"});
    html += pickerBtn("Existing person…");
  } else if (d.kind === "needs_choice") {
    let nearShown = 0;
    for (const n of (d.near || []).slice(0, 2)) {
      if (!n.uuid) continue;
      nearShown++;
      html += candBtn("into", cv, "track", "This is " + n.name,
        {target: n.uuid, msg: "Filed into " + n.name, disabled: edited});
    }
    html += candBtn("create", cv, "track", "Add as new person",
      {distinct: true, msg: "Added"});
    html += pickerBtn(nearShown ? "Someone else…" : "Existing person…");
  } else if (d.kind === "ambiguous") {
    if ((d.choices || []).length) {
      for (const c of d.choices) {
        html += candBtn("into", cv, "track", "This is " + c.name,
          {target: c.uuid, msg: "Filed into " + c.name, disabled: edited});
      }
    } else {
      html += '<div class="notice">Could be ' +
        esc((d.hits || []).map(h => h.name).join(" or ")) +
        " — their evidence is mixed together and needs untangling in DEVONthink.</div>" +
        '<div class="chips">' + dtLink(cv.uuid, "Open in DEVONthink") + "</div>";
    }
  }
  html += candBtn("quiet", cv, "forget", "Dismiss",
    {msg: "Dismissed — may come back later", noundo: true,
     tip: "Forget for now — they come back if they’re seen again"});
  html += candBtn("danger", cv, "ignore", "Ignore",
    {msg: "Won’t be suggested again",
     tip: "Never suggest this person again"});
  return html + "</div>";
}

async function decideCandidate(uuid, action, extra, doneMsg, noUndo) {
  const body = Object.assign({action}, extra || {});
  await postDecision("api/candidate/" + uuid, body, "c-" + uuid, doneMsg,
    noUndo ? null : () => api("api/candidate/" + uuid, {action: "undo"}));
  queue.candidates = queue.candidates.filter(c => c.uuid !== uuid);
  updateHeader();
}

/* ---------- roster picker ---------- */

function openPicker(uuid) {
  const cv = queue.candidates.find(c => c.uuid === uuid);
  const near = ((cv && cv.disposition && cv.disposition.near) || []).filter(n => n.uuid);
  const nearIds = new Set(near.map(n => n.uuid));
  const rows = near.map(n => ({uuid: n.uuid, name: n.name, aliases: [], tag: "likely match"}));
  for (const p of queue.roster || []) {
    if (!nearIds.has(p.uuid)) rows.push({uuid: p.uuid, name: p.name, aliases: p.aliases, tag: ""});
  }
  const picker = $("#picker");
  picker.innerHTML = '<div class="sheet"><header>Who is this?' +
    '<button class="iconbtn" data-act="close-picker">✕</button></header>' +
    '<input type="search" name="person-search" placeholder="Search people" autocomplete="off">' +
    "<ul>" + rows.map(r =>
      '<li data-search="' + esc((r.name + " " + r.aliases.join(" ")).toLowerCase()) +
      '"><button data-act="pick" data-uuid="' + esc(uuid) + '" data-target="' + esc(r.uuid) +
      '" data-name="' + esc(r.name) + '">' + esc(r.name) +
      (r.aliases.length ? ' <span class="alias">' + esc(r.aliases.join(", ")) + "</span>" : "") +
      (r.tag ? '<span class="tag">' + esc(r.tag) + "</span>" : "") +
      "</button></li>").join("") + "</ul></div>";
  picker.classList.remove("hidden");
  $("input", picker).addEventListener("input", e => filterPicker(e.target.value));
  if (matchMedia("(min-width: 600px)").matches) $("input", picker).focus();
}

function filterPicker(q) {
  q = q.trim().toLowerCase();
  for (const li of document.querySelectorAll("#picker li"))
    li.classList.toggle("hidden", !!q && !li.dataset.search.includes(q));
}

function closePicker() { $("#picker").classList.add("hidden"); }

/* ---------- proposals ---------- */

function proposalCard(pv, o) {
  const u = esc(pv.uuid);
  if (pv.broken) {
    return '<div class="card" id="c-' + u + '"><div class="cardtop">' +
      '<span class="who">' + esc(pv.title) + '</span>' +
      '<span class="badge">unreadable</span></div>' +
      '<div class="notice">This proposal can’t be read here — it needs a look in DEVONthink.</div>' +
      '<div class="chips">' + dtLink(pv.uuid, "Open in DEVONthink") + "</div></div>";
  }
  let html = '<div class="card" id="c-' + u + '"><div class="cardtop">' +
    '<span class="who">' + esc(pv.source.name || pv.title) + "</span>" +
    (pv.source.date ? '<span class="meta">' + esc(pv.source.date) + "</span>" : "") +
    "</div>";
  if (pv.source.uuid)
    html += '<div class="chips">' + dtLink(pv.source.uuid, "Open source note") + "</div>";
  if (pv.empty) {
    html += '<div class="notice">Nothing filable was found in this capture — file it by hand or let it go.</div>';
    if (pv.captured) html += '<div class="captured">' + esc(pv.captured) + "</div>";
    html += '<div class="actions">' +
      propBtn("", pv, "approve", "Clear it", {msg: "Cleared"}) +
      propBtn("danger", pv, "reject", "Delete", {msg: "Deleted", noundo: true}) +
      "</div>";
    return html + "</div>";
  }
  pv.plans.forEach((plan, pi) => { html += planBlock(plan, pi, pv.editable, o); });
  if (!pv.editable)
    html += '<div class="chips"><span class="chip">applies exactly as written</span></div>';
  html += '<div class="actions">' +
    '<button class="btn primary" data-act="approve" data-uuid="' + u + '">Approve</button>' +
    propBtn("danger", pv, "reject", "Reject", {msg: "Rejected", noundo: true}) +
    "</div>";
  return html + "</div>";
}

function propBtn(cls, pv, action, label, opts) {
  opts = opts || {};
  return '<button class="btn ' + cls + '" data-act="prop" data-uuid="' + esc(pv.uuid) +
    '" data-action="' + action + '"' + (opts.noundo ? ' data-noundo="1"' : "") +
    ' data-msg="' + esc(opts.msg || label) + '">' + esc(label) + "</button>";
}

function rowCheckbox(slot, off, planOff) {
  return '<input type="checkbox" data-role="row" data-slot="' + slot + '"' +
    (off ? "" : " checked") + (planOff ? " disabled" : "") + ">";
}

function planBlock(plan, pi, editable, o) {
  const planOff = isOff(o, "plan:" + pi);
  const cb = editable
    ? '<input type="checkbox" data-role="plan" data-slot="plan:' + pi + '"' +
      (planOff ? "" : " checked") + ">"
    : "";
  if (plan.kind === "event") {
    let html = '<div class="plan" data-pi="' + pi + '"><div class="planhead">' + cb +
      "📅 " + esc(plan.name) + ' <span class="meta">' + esc(plan.date) +
      (plan.location ? " · " + esc(plan.location) : "") + "</span></div><ul class='rows'>";
    const off = planOff ? ' class="off"' : "";
    if (plan.attendees.length)
      html += "<li" + off + '><span class="rowtext">with ' +
        esc(plan.attendees.join(", ")) + "</span></li>";
    if (plan.summary)
      html += "<li" + off + '><span class="rowtext">' + esc(plan.summary) + "</span></li>";
    return html + "</ul></div>";
  }
  const tag = plan.kind === "new" ? ' <span class="badge">new person</span>' : "";
  const nameHtml = editable
    ? '<span data-role="pname" data-slot="pname:' + pi + '" data-max="120">' +
      '<span class="txt">' + esc(editedValue(o, "pname:" + pi, plan.name)) +
      '</span> <span class="pencil">✎</span></span>'
    : esc(plan.name);
  let html = '<div class="plan" data-pi="' + pi + '"><div class="planhead">' + cb +
    nameHtml + tag + "</div><ul class='rows'>";
  plan.facts.forEach((f, fi) => {
    const slot = "fact:" + pi + ":" + fi;
    const off = planOff || isOff(o, slot);
    html += "<li" + (off ? ' class="off"' : "") + ">" +
      (editable ? rowCheckbox(slot, off, planOff) : "") +
      '<span class="rowtext" data-role="fact" data-slot="' + slot + '" data-max="400">' +
      '<span class="d">' + esc(f[0]) + "</span><span class=\"txt\">" +
      esc(editedValue(o, slot, f[1])) + "</span></span></li>";
  });
  for (const [k, v] of Object.entries(plan.updates)) {
    const slot = "field:" + pi + ":" + k;
    const off = planOff || isOff(o, slot);
    html += "<li" + (off ? ' class="off"' : "") + ">" +
      (editable ? rowCheckbox(esc(slot), off, planOff) : "") +
      '<span class="rowtext" data-role="field" data-slot="' + esc(slot) +
      '" data-max="400">' +
      '<span class="fieldkey">' + esc(k) + ' → </span><span class="txt">' +
      esc(editedValue(o, slot, v)) + "</span></span></li>";
  }
  return html + "</ul></div>";
}

function startEdit(span) {
  if (span.querySelector("input")) return;
  const key = cardKeyOf(span);
  const slot = span.dataset.slot;
  if (!key || !slot) return;
  const txt = $(".txt", span);
  const before = txt.textContent;
  span.classList.add("editing");
  txt.innerHTML = '<input type="text" maxlength="' +
    (Number(span.dataset.max) || 400) + '">';
  const input = $("input", txt);
  input.value = before;
  input.addEventListener("blur", () => {
    const value = input.value.replace(/\s+/g, " ").trim();
    span.classList.remove("editing");
    txt.textContent = value || before;
    if (value) setEdit(key, slot, value);
    render();
  });
  input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
  input.focus();
}

async function approveProposal(uuid, confirm) {
  const pv = queue.proposals.find(p => p.uuid === uuid);
  let body = {action: "approve"};
  if (pv.editable) {
    const spec = buildSpec(pv, overlayOf(local, "c-" + uuid));
    if (spec.changed || confirm) {
      if (!spec.people.length && !spec.events.length) {
        banner("Nothing left to file — use Reject instead.");
        return;
      }
      body = {action: "approve", people: spec.people, events: spec.events,
              confirm: !!confirm};
    }
  }
  let res;
  try {
    res = await api("api/proposal/" + uuid, body);
  } catch (e) {
    banner(e.message);
    return;
  }
  if (res.confirm) {
    const names = res.confirm.map(c => c.name + " (resembles " +
      c.near.join(", ") + ")").join("; ");
    if (window.confirm("Create as a separate new person? " + names)) {
      return approveProposal(uuid, true);
    }
    return;
  }
  removeCard("c-" + uuid, "Approved",
    () => api("api/proposal/" + uuid, {action: "undo"}));
  queue.proposals = queue.proposals.filter(p => p.uuid !== uuid);
  updateHeader();
}

async function decideProposal(uuid, action, doneMsg, noUndo) {
  await postDecision("api/proposal/" + uuid, {action}, "c-" + uuid, doneMsg,
    noUndo ? null : () => api("api/proposal/" + uuid, {action: "undo"}));
  queue.proposals = queue.proposals.filter(p => p.uuid !== uuid);
  updateHeader();
}

/* ---------- shared decision plumbing ---------- */

async function postDecision(path, body, cardId, doneMsg, undoFn) {
  try {
    await api(path, body);
  } catch (e) {
    banner(e.message);
    if (e.data && e.data.error === "devonthink-closed") refresh(false);
    throw e;
  }
  removeCard(cardId, doneMsg, undoFn);
}

function removeCard(cardId, msg, undoFn) {
  const card = document.getElementById(cardId);
  if (card) {
    card.classList.add("leaving");
    setTimeout(() => card.remove(), 180);
  }
  toast(msg, undoFn);
}

function toast(msg, undoFn) {
  const t = $("#toast");
  clearTimeout(toastTimer);
  t.innerHTML = esc(msg) + (undoFn ? ' <button id="undoBtn">Undo</button>' : "");
  t.classList.remove("hidden");
  if (undoFn) {
    $("#undoBtn").onclick = async () => {
      t.classList.add("hidden");
      try { await undoFn(); } catch (e) { banner("Undo failed — " + e.message); }
      refresh(false);
    };
  }
  toastTimer = setTimeout(() => {
    t.classList.add("hidden");
    refresh(false);
  }, 8000);
}

async function applyNow() {
  try { await api("api/apply", {}); } catch (e) { banner(e.message); return; }
  refresh(false);
}

async function openDT() {
  try { await api("api/open-dt", {}); } catch (e) { banner(e.message); return; }
  showState("opening",
    '<div class="state"><div class="big">💤</div>Opening DEVONthink…</div>');
  let tries = 0;
  const wait = async () => {
    await refresh(false);
    if (queue && queue.dt === "ok") return;
    if (++tries < 10) setTimeout(wait, 3000);
  };
  setTimeout(wait, 3000);
}

function jumpToHash() {
  const id = location.hash.replace("#", "");
  if (!id) return;
  const card = document.getElementById("c-" + id);
  if (card) {
    card.scrollIntoView({block: "center"});
    card.classList.add("flash");
  }
  history.replaceState(null, "", location.pathname);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    const span = e.target.closest("span[data-slot]");
    if (span && span.closest("#content")) startEdit(span);
    if (e.target === $("#picker")) closePicker();
    return;
  }
  const d = el.dataset;
  switch (d.act) {
    case "migration-answer": decideCapture(d.uuid, "migration"); break;
    case "capture-save": decideCapture(d.uuid, "save"); break;
    case "capture-undo": decideCapture(d.uuid, "undo"); break;
    case "capture-retain": decideCapture(d.uuid, "retain"); break;
    case "capture-defer": decideCapture(d.uuid, "defer"); break;
    case "capture-retry": decideCapture(d.uuid, "retry"); break;
    case "capture-keep": decideCapture(d.uuid, "keep-edited"); break;
    case "capture-edit": captureOverlay(d.uuid).captureEdit = true; render(); break;
    case "capture-reload": delete local["c-" + d.uuid]; captureOverlay(d.uuid).captureEdit = true; render(); break;
    case "capture-add": captureOverlay(d.uuid).captureRows.push({mention:"", passage:"", target:"", email:""}); render(); break;
    case "capture-remove": {
      const rows = captureOverlay(d.uuid).captureRows;
      if (rows.length > 1) rows.splice(Number(d.row), 1);
      render();
      break;
    }
    case "refresh": refresh(true); break;
    case "apply": applyNow(); break;
    case "open-dt": openDT(); break;
    case "picker": openPicker(d.uuid); break;
    case "close-picker": closePicker(); break;
    case "pick":
      closePicker();
      decideCandidate(d.uuid, "track", {target: d.target}, "Filed into " + d.name);
      break;
    case "cand": {
      const extra = {target: d.target || undefined,
                     distinct: d.distinct ? true : undefined};
      if (d.action === "track" && !d.target) {
        const cv = queue.candidates.find(c => c.uuid === d.uuid);
        const name = editedValue(overlayOf(local, "c-" + d.uuid), "cname",
                                 cv ? cv.name : "");
        if (cv && name !== cv.name) extra.name = name;
      }
      decideCandidate(d.uuid, d.action, extra, d.msg, !!d.noundo);
      break;
    }
    case "prop": decideProposal(d.uuid, d.action, d.msg, !!d.noundo); break;
    case "approve": approveProposal(d.uuid); break;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  const key = cardKeyOf(t);
  if (!key) return;
  const uuid = key.slice(2);
  if (t.dataset.captureText) captureOverlay(uuid).captureText = t.value;
  if (t.dataset.captureRow !== undefined) captureOverlay(uuid).captureRows[Number(t.dataset.captureRow)][t.dataset.field] = t.value;
  if (t.dataset.semanticKey !== undefined) {
    const o = captureOverlay(uuid);
    (o.captureAnswers || (o.captureAnswers = {}))[t.dataset.semanticKey] = t.value;
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (!t.matches('input[type="checkbox"][data-slot]')) return;
  const key = cardKeyOf(t);
  if (!key) return;
  setOff(key, t.dataset.slot, !t.checked);
  render();
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && queue) refresh(false);
});

window.addEventListener("hashchange", () => {
  if (queue) jumpToHash();
});

refresh(true);
</script>
</body>
