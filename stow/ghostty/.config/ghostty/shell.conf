command = /opt/homebrew/bin/fish
keybind = ctrl+semicolon=unbind
keybind = cmd+n=new_window
keybind = cmd+t=new_split:down
keybind = cmd+shift+t=new_tab
keybind = cmd+d=new_split:right
keybind = cmd+shift+d=new_split:down
keybind = cmd+shift+h=goto_split:left
keybind = cmd+shift+j=goto_split:down
keybind = cmd+shift+k=goto_split:up
keybind = cmd+shift+l=goto_split:right
keybind = cmd+w=close_surface
keybind = cmd+alt+w=close_tab:this
keybind = cmd+shift+enter=toggle_split_zoom
keybind = cmd+shift+left_bracket=previous_tab
keybind = cmd+shift+right_bracket=next_tab
keybind = cmd+ctrl+n=unbind
keybind = cmd+ctrl+w=unbind
keybind = cmd+1=goto_tab:1
keybind = cmd+2=goto_tab:2
keybind = cmd+3=goto_tab:3
keybind = cmd+4=goto_tab:4
keybind = cmd+5=goto_tab:5
keybind = cmd+6=goto_tab:6
keybind = cmd+7=goto_tab:7
keybind = cmd+8=goto_tab:8
keybind = cmd+9=last_tab
keybind = cmd+digit_1=goto_tab:1
keybind = cmd+digit_2=goto_tab:2
keybind = cmd+digit_3=goto_tab:3
keybind = cmd+digit_4=goto_tab:4
keybind = cmd+digit_5=goto_tab:5
keybind = cmd+digit_6=goto_tab:6
keybind = cmd+digit_7=goto_tab:7
keybind = cmd+digit_8=goto_tab:8
keybind = cmd+digit_9=last_tab
