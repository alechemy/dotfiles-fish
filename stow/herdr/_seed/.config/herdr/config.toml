onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "fish"
new_cwd = "follow"

[update]
version_check = false

[keys]
split_horizontal = ["prefix+minus", "cmd+t", "cmd+shift+d"]
split_vertical = ["prefix+v", "cmd+d"]
new_tab = ["prefix+c", "cmd+shift+t"]
focus_pane_left = ["prefix+h", "cmd+shift+h"]
focus_pane_down = ["prefix+j", "cmd+shift+j"]
focus_pane_up = ["prefix+k", "cmd+shift+k"]
focus_pane_right = ["prefix+l", "cmd+shift+l"]
close_pane = ["prefix+x", "cmd+w"]
close_tab = ["prefix+shift+x", "cmd+alt+w"]
zoom = ["prefix+z", "cmd+shift+enter"]
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
new_workspace = ["prefix+shift+n", "cmd+ctrl+n"]
workspace_picker = ["prefix+w", "cmd+ctrl+w"]
switch_tab = ["prefix+1..9", "cmd+1..9"]

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
window_title = "{workspace}: {tab}"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "state_text"]]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
